name: Build Interface.dylib

on:
  workflow_dispatch:
  push:
    paths:
      - "Interface.m"
      - "AudioChipmunk.m"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Compilar dylib (arm64, iOS)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=14.0 \
            Interface.m AudioChipmunk.m -o Interface.dylib \
            -framework UIKit -framework Foundation -framework AudioToolbox \
            -framework AVFoundation -framework CoreGraphics -framework UniformTypeIdentifiers \
            -fobjc-arc

      - name: Firmar ad-hoc
        run: codesign -s - Interface.dylib

      - name: Subir dylib
        uses: actions/upload-artifact@v4
        with:
          name: Interface-dylib
          path: Interface.dylib
