name: Build DiscordTweaks.dylib

on:
  workflow_dispatch:
  push:
    paths:
      - "*.m"
      - "*.h"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Compilar dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=14.0 \
            AudioChipmunk.m Interface.m Spoofer.m AudioSessionHook.m -o DiscordTweaks.dylib \
            -framework UIKit -framework Foundation -framework AudioToolbox \
            -framework AVFoundation -framework CoreGraphics -framework UniformTypeIdentifiers \
            -fobjc-arc

      - name: Firmar ad-hoc
        run: codesign -s - DiscordTweaks.dylib

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DiscordTweaks-dylib
          path: DiscordTweaks.dylib
